name: Daily finance and technology briefing

on:
  schedule:
    - cron: '0 10 * * *'
      timezone: 'Asia/Kolkata'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate today's briefing
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-luna
        run: python scripts/generate_blog.py

      - name: Publish generated post
        run: |
          git config user.name 'market-tech-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add posts/
          git diff --cached --quiet && echo 'No new post generated.' && exit 0
          git commit -m "Publish daily finance and technology briefing"
          git push
